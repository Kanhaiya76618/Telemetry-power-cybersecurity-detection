# ====================================================================
#  LOCAL DEMO CONFIGURATION — ANONYMOUS ACCESS ENABLED
#  Use ONLY on an isolated, trusted network (your home Wi-Fi / hotspot).
#  For the lab or any shared network use mosquitto.secure.conf.
# ====================================================================
# Mosquitto 2 only listens on localhost unless a listener is declared.
# 0.0.0.0 inside the container + the "1883:1883" port mapping = reachable from the LAN.
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
max_packet_size 4096
